<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>QuranArena — export check</title>
<style>
  html, body { margin: 0; background: #06080b; color: #e8edf2; font-family: Helvetica, Arial, sans-serif; }
  .wrap { padding: 48px; display: flex; flex-direction: column; gap: 32px; }
  .row { display: flex; align-items: center; gap: 28px; padding: 22px 24px; background: #0b1016; border: 1px solid #1b2530; border-radius: 14px; }
  .lbl { font-family: ui-monospace, monospace; font-size: 11.5px; color: #6b7a87; }
  a { color: #10d992; }
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <img src="favicon.svg" width="32" height="32" alt="">
    <img src="favicon.svg" width="20" height="20" alt="">
    <span class="lbl">favicon.svg — 32 / 20</span>
  </div>
  <div class="row">
    <img src="icon-512.svg" width="128" height="128" alt="">
    <span class="lbl">icon-512.svg — app icon / social</span>
  </div>
  <div class="row">
    <img src="star.svg" width="54" height="54" alt="">
    <span class="lbl">star.svg — transparent, no badge</span>
  </div>
  <div class="row">
    <img src="lockup.svg" width="208" height="64" alt="">
    <span class="lbl">lockup.svg — navbar</span>
  </div>
</div>
</body>
</html>
